{{ define "main" }}
<main class="page-shell">

  {{ range .Params.sections }}
    <section id="{{ .id }}" class="content-section">
      <div class="section-header">
        <h2 class="section-title">{{ .title }}</h2>
      </div>

      {{ with .people }}
        {{ if gt (len .) 0 }}
          {{ partial "contact-card.html" . }}
        {{ else }}
          <p class="section-intro">Details will be added here.</p>
        {{ end }}
      {{ end }}
    </section>
  {{ end }}

</main>
{{ end }}
